[package]
name = "null-hq"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
null-proto = { path = "../null-proto" }
null-bus = { path = "../null-bus" }
null-op = { path = "../null-op" }
null-squad = { path = "../null-squad" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["sync", "time", "rt", "macros"] }
