# Which ability-check modules a changed path can affect (read by scripts/affected_modules.sh).
# Spec: specs/plans/ABILITY_CHECK.md §Which modules a change reruns
#
# Built by tracing, not guessing: module -> Op (skill*.rs) -> BotCommands / BotView (null-bot-api,
# mc-adapter) -> fork systems. Coarse: one entry per crate area or file.
#
# Rules of the matcher:
# - A path is a prefix. Null paths are relative to the repo root; fork paths start with `azalea:`
#   and are relative to the fork root.
# - The longest matching prefix decides. `all = true` means every module reaches the code (tick
#   loop, connection, login, protocol, shared harness, the bot API).
# - A path that matches no entry and no ignore pattern makes the helper print `all` and name it.
# - A pattern in `ignore` ending in `/` is a prefix; any other pattern is a glob over the whole path.
#
# Module ids (27): A1 A2 A3 A4 A2S A4S A4C A5 A6 A7 A8 A9 A10 A10E A11 A12 A13 A14 A15 A16 A17 A18 A19 A20 A21 A22 A23 AT.
#
# Reach in one line each (what the ops go through):
#   block ops (Break, Place*, BreakAim, BreakSpam, Mail, Gather): block_actions, mining, interact/pick
#   walk and look (ItemOp::Walk, Jump, Sneak, Goto): movement, azalea-physics, pathfinder (Goto, Gather)
#   item ops (Use, Release, Attack): item_use, attack, attackers, interact
#   window ops (Inv): inventory plugin, azalea-inventory operations, container use (use-block)
#   life ops (Life, kill by RCON): respawn, packet/game, the unmodelled gate
#   every module: tick loop, connection, login, scene_in (attributes, effects, SelectSlot)

ignore = [
  "specs/", "scripts/", "mc_server4/", "target/",
  "*.md", "*.log", "*.txt", ".gitignore",
  "harness/skeleton-server/scripts/", "harness/grim-server/scripts/", "harness/skeleton-server/runs/",
  "azalea:codegen/", "azalea:docs-rs/", "azalea:target/", "azalea:.github/",
  "azalea:*/tests/*", "azalea:*/tests.rs", "azalea:*/benches/*",
  "azalea:CHANGELOG*", "azalea:LICENSE*", "azalea:typos.toml", "azalea:rustfmt.toml",
]

