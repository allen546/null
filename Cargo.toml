[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Our Azalea fork (specs/reference/AZALEA_PATCHES.md), pinned. To build against the local
# clone while editing it, add a [patch] to ~/.cargo/config.toml (specs/reference/AZALEA_PATCHES.md).
[workspace.dependencies]
azalea = { git = "https://github.com/allen546/azalea", rev = "7d9102a7835df2b7a39fdcb01c25c633cf34939d" }
azalea-client = { git = "https://github.com/allen546/azalea", rev = "7d9102a7835df2b7a39fdcb01c25c633cf34939d" }
