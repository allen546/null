[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Our Azalea fork (specs/reference/AZALEA_PATCHES.md), pinned. To build against the local
# clone while editing it, add a [patch] to ~/.cargo/config.toml (specs/reference/AZALEA_PATCHES.md).
[workspace.dependencies]
azalea = { git = "https://github.com/allen546/azalea", rev = "72e0e01afc3c6251ae11ff23b698f1a211eb4207" }
azalea-client = { git = "https://github.com/allen546/azalea", rev = "72e0e01afc3c6251ae11ff23b698f1a211eb4207" }
