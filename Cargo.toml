[workspace]
resolver = "3"
members = ["crates/*", "harness/vanilla-diff/tap"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Our Azalea fork (specs/reference/AZALEA_PATCHES.md), pinned. To build against the local
# clone while editing it, add a [patch] to ~/.cargo/config.toml (specs/reference/AZALEA_PATCHES.md).
[workspace.dependencies]
azalea = { git = "https://github.com/allen546/azalea", rev = "f994d4d1df5e72b6697876bf233ac882069df3e8" }
azalea-client = { git = "https://github.com/allen546/azalea", rev = "f994d4d1df5e72b6697876bf233ac882069df3e8" }
