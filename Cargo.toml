[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Our Azalea fork (specs/reference/AZALEA_PATCHES.md), pinned. To build against the local
# clone while editing it, add a [patch] to ~/.cargo/config.toml (specs/reference/AZALEA_PATCHES.md).
[workspace.dependencies]
azalea = { git = "https://github.com/allen546/azalea", rev = "bc1094230fa89a40ef5162d44a2d2a283bae640f" }
azalea-client = { git = "https://github.com/allen546/azalea", rev = "bc1094230fa89a40ef5162d44a2d2a283bae640f" }
