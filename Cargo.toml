[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Our Azalea fork (specs/reference/AZALEA_PATCHES.md), pinned. To build against the local
# clone while editing it, add a [patch] to ~/.cargo/config.toml (specs/reference/AZALEA_PATCHES.md).
[workspace.dependencies]
azalea = { git = "https://github.com/allen546/azalea", rev = "ae0e7d5539111bd186e84e80592d3f40dd03b688" }
azalea-client = { git = "https://github.com/allen546/azalea", rev = "ae0e7d5539111bd186e84e80592d3f40dd03b688" }
