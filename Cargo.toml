[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Our Azalea fork (specs/reference/AZALEA_PATCHES.md), pinned. To build against the local
# clone while editing it, add a [patch] to ~/.cargo/config.toml (specs/reference/AZALEA_PATCHES.md).
[workspace.dependencies]
azalea = { git = "https://github.com/allen546/azalea", rev = "a0601a03dfa889a3044ad8199a0c9d2dc50ef8bf" }
azalea-client = { git = "https://github.com/allen546/azalea", rev = "a0601a03dfa889a3044ad8199a0c9d2dc50ef8bf" }
