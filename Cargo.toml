[workspace]
resolver = "3"
members = ["crates/*", "harness/vanilla-diff/tap"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Our Azalea fork (specs/reference/AZALEA_PATCHES.md), pinned. To build against the local
# clone while editing it, add a [patch] to ~/.cargo/config.toml (specs/reference/AZALEA_PATCHES.md).
[workspace.dependencies]
azalea = { git = "https://github.com/allen546/azalea", rev = "4eac96f058f40f4db8f555cc4fcfb8bd327055a0" }
azalea-client = { git = "https://github.com/allen546/azalea", rev = "4eac96f058f40f4db8f555cc4fcfb8bd327055a0" }
