[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

# Our Azalea fork (specs/reference/AZALEA_PATCHES.md), pinned. To build against the local
# clone while editing it, add a [patch] to ~/.cargo/config.toml (specs/reference/AZALEA_PATCHES.md).
[workspace.dependencies]
azalea = { git = "https://github.com/allen546/azalea", rev = "6b9d22eef7fcbf7bbe2ee5ad527fbc235b00efa6" }
azalea-client = { git = "https://github.com/allen546/azalea", rev = "6b9d22eef7fcbf7bbe2ee5ad527fbc235b00efa6" }
